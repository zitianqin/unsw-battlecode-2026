# The listener's per-team sonar formats (the bot's listen.hpp), one [[format]] per team per protocol version.
# tools/sonar/formats.py turns this into the bot's listen_formats.hpp; tools/sonar/verify.py checks every entry on replays
# (--update writes cover, stray, detects and verified to tools/sonar/measured.json, which overrides the same keys
# here); tools/sonar/refresh.py does both and adds new versions (README.md). Never delete an old version: a team may
# bring any of them to a tournament. To add one by hand, append an entry:
#
#   [[format]]
#   team = 91                      # the site's team id
#   name = "SSS"
#   version = "replays-2026-10-01" # unique per team: where it came from and when
#   kind = "report"                # report (plain fields) | keyed (cipher; a recogniser if known) | token | silent
#   source = "what it was read from (a report section, the games' ids or submissions)"
#   note = "anything a reader needs"
#     [[format.layout]]            # up to 3 message types; a value is one when (value & mask) == value
#     mask = "0xfff0000000000000"
#     value = "0xf5e0000000000000"
#     flip = "0x0"                 # optional: fields are read after XORing the value with this
#     x = [25, 6]                  # [shift, bits]; or tile = [shift, bits] for y * width + x
#     y = [19, 6]
#     length = [31, 7]             # optional: length, round, id; lag = rounds old when no round field
#     round = [10, 9]              # sighting = true when the layout reports the sender's enemy (us)
#     id = [38, 14]
#
# Entries below, in this order: those checked by hand on replays, research/leader-sonar and
# ~/.bc-loop/reports/keyed-sonar-2026-10-01.md (1 Oct); those the field search (discover.py) found on each team's
# newest ranked games ("replays-2026-10-01"); each team's constant bits as a keyed recogniser ("...-tag"); the same two
# searches over each team's 16th to 40th newest games, kept where they differ ("replays-<first day>-to-<last day>");
# copies of verified entries whose recogniser was tightened against the team they were confused with ("...-sep");
# then research/top-300-sonar-protocols.md (30 Sep) and research/top-300-sonar-protocols-updated.md (1 Oct) as their
# Master Protocol Reference Tables state them (reports.py). Nothing here is trusted until verify.py measures it.

[[format]]
team = 91
name = "SSS"
version = "replays-2026-10-01-type0"
kind = "report"
source = "replays: SSS's newest 15 ranked games (to 30 Sep 16:00 UTC), checked by hand with the field search"
note = "magic 0xf5e | type 2 bits (0 here) | id 12 | length 7 | x 6 | y 6 | round 9 | check 10 (not recovered); the length is the sender's belief and lags a split"
  [[format.layout]]
  mask = "0xfffc000000000000"
  value = "0xf5e0000000000000"
  id = [38, 12]
  length = [31, 7]
  x = [25, 6]
  y = [19, 6]
  round = [10, 9]

[[format]]
team = 91
name = "SSS"
version = "replays-2026-10-01-type23"
kind = "report"
source = "replays: SSS's newest 15 ranked games (to 30 Sep 16:00 UTC), checked by hand with the field search"
note = "types 2 and 3 of the same layout; about 85% of heads true (relayed or planned positions?); type 1 (x = y = 63) carries no position"
  [[format.layout]]
  mask = "0xfffc000000000000"
  value = "0xf5e8000000000000"
  id = [38, 12]
  length = [31, 7]
  x = [25, 6]
  y = [19, 6]
  round = [10, 9]
  [[format.layout]]
  mask = "0xfffc000000000000"
  value = "0xf5ec000000000000"
  id = [38, 12]
  length = [31, 7]
  x = [25, 6]
  y = [19, 6]
  round = [10, 9]

