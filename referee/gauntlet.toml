# Frozen opponents that play unlike the champion, for the opponent screen a candidate takes when its SPRT keeps it
# or leaves it promising, or a kept identical idea (loop/driver.py check_pool), the late screen (loop/rescreen.py) and
# the SPRT's rotation (driver.ROTATION names which); the prewarm (loop/baselines.py), a review's rule counts
# (loop/rulecounts.py) and evidence.md (loop/evidence.py) play them too. Beating our own last version can reward a
# change that other styles punish: v0011's merge cascade won +30 against v0010, which also folds late, then lost
# online to swarms.
# Each opponent is the bot/ folder of a commit in the main repo, with some bot/params.hpp values replaced.
# Don't edit an entry once used: add a new name instead, so screens stay comparable.

[[opponent]]
name = "v0004"  # sprint rams, no late-game folding or sonar
